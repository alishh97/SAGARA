server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Foto maksimal 5 MB, beri sedikit kelonggaran
  client_max_body_size 6m;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_read_timeout 60s;
  }

  location /uploads/ {
    proxy_pass http://backend:3000;
  }

  # Agar Vue Router tetap jalan saat halaman di-refresh
  location / {
    try_files $uri $uri/ /index.html;
  }
}
